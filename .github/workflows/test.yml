name: Test Suite

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  test-api:
    name: API Tests (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'api/pyproject.toml'

      - name: Install UV
        run: pip install uv

      - name: Install API dependencies
        working-directory: api
        run: |
          uv sync --dev
          uv pip install pytest-cov pytest-asyncio httpx

      - name: Run API tests with coverage
        working-directory: api
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
        run: |
          pytest tests/ --cov=./ --cov-report=xml --cov-report=term -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: api/coverage.xml
          flags: api
          fail_ci_if_error: false

  test-web:
    name: Frontend Tests (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Type-check
        working-directory: web
        run: bun run check

      - name: Run frontend tests
        working-directory: web
        run: bun run test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: web/coverage/coverage-final.json
          flags: web
          fail_ci_if_error: false

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-api, test-web]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install E2E dependencies
        working-directory: e2e
        run: bun install

      - name: Install Playwright browsers
        working-directory: e2e
        run: bunx playwright install --with-deps

      - name: Start Docker services
        run: |
          docker compose up -d --wait
          sleep 15

      - name: Run Playwright E2E tests
        working-directory: e2e
        env:
          API_URL: http://localhost:8000
          WEB_URL: http://localhost:8080
        run: |
          bun run test --reporter=line --retries=2

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose down -v
