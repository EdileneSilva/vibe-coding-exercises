name: Lint and Quality Checks

on:
  push:
    branches: [develop, main]
    paths:
      - '**.py'
      - '**.ts'
      - '**.svelte'
      - '**.md'
      - '**.yml'
      - '**.yaml'
      - '**.json'
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install linting dependencies
        run: bun install --frozen-lockfile

      - name: Run Markdown lint
        run: bun run lint:md

  lint-yaml:
    name: YAML Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install linting dependencies
        run: bun install --frozen-lockfile

      - name: Run YAML lint
        run: bun run lint:yaml

  lint-python:
    name: Python Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV
        run: pip install uv

      - name: Install Ruff
        working-directory: api
        run: uv pip install ruff

      - name: Run Ruff check
        working-directory: api
        run: ruff check .

      - name: Run Ruff format check
        working-directory: api
        run: ruff format --check .

  lint-typescript:
    name: TypeScript Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Type-check
        working-directory: web
        run: bun run check

  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install commitlint
        run: bun install --frozen-lockfile

      - name: Lint last commit
        run: bun run lint:commit
